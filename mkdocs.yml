site_name: AppBox Docs
site_description: AppBox Documentation
site_url: https://docs.getappbox.com
copyright: Copyright © AppBox
repo_url: https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation
repo_name: AppBox
remote_branch: gh-pages
dev_addr: 127.0.0.1:2000 
edit_uri: blob/master/docs/

# Customization (single `extra:` block — a second one later in the file would silently
# replace this whole mapping, YAML last-key-wins). The removed `google_analytics:` option
# pointed at a discontinued Universal Analytics property; use Material's `extra.analytics`
# with a GA4 property if analytics is wanted again.
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: 'https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation'

# Configuration
theme:
  name: 'material'
  language: 'en'
  logo: Images/AppBoxIcon.png
  favicon: Images/AppBoxIcon.png
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: white
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    toggle:
      icon: material/lightbulb-outline
      name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search:
      lang: en
  - awesome-pages
  - minify:
      minify_html: true